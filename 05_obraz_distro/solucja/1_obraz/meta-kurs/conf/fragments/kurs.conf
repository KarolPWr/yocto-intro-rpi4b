BB_CONF_FRAGMENT_SUMMARY = "Konfiguracja płytki na kurs Yocto (RPi 4B)"
BB_CONF_FRAGMENT_DESCRIPTION = "Licencja firmware WiFi/BT, konsola UART, U-Boot, overlaye DT (LED, BME280), I2C."

# akceptacja licencji firmware WiFi/BT (linux-firmware-rpidistro)
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# konsola szeregowa na pinach GPIO (UART)
ENABLE_UART = "1"

# bootloader U-Boot między firmware RPi a kernelem
RPI_USE_U_BOOT = "1"

# nasze overlaye DT na partycji boot (recepta kurs-overlays)
IMAGE_BOOT_FILES:append = " devicetree/kurs-led.dtbo;overlays/kurs-led.dtbo"
do_image_wic[depends] += "kurs-overlays:do_deploy"

# szyna I2C na pinach GPIO2/GPIO3
ENABLE_I2C = "1"

# gotowy overlay czujników I2C z kernela RPi (domyślnie meta-raspberrypi go nie buduje)
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/i2c-sensor.dtbo"
